<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">

<title>{% if page.title %}{{ page.title | strip_html | escape }} | {{ site.name }}{% else %}{{ site.title | escape }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
<meta name="keywords" content="Delyan Boychev, Computer Vision, Vision-Language Models, NLP, Machine Learning, INSAIT, Sofia University, Bulgaria, Remote Sensing">
<meta name="author" content="{{ site.name | escape }}">
{% unless page.canonical == false %}<link rel="canonical" href="{{ site.url }}{{ page.url | relative_url }}">{% endunless %}

<meta name="msvalidate.01" content="{{ site.bing_verification }}">

<link rel="icon" type="image/png" sizes="96x96" href="{{ '/favicon.png' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.name | escape }}" href="{{ '/feed.xml' | relative_url }}">

<link rel="preload" href="{{ '/assets/fonts/lmroman10-regular.otf' | relative_url }}" as="font" type="font/otf" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/lmroman10-bold.otf' | relative_url }}" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

{% include jsonld.html %}
