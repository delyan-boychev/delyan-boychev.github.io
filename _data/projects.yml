- id: "disentangled-flash"
  title: "DisentangledFlash"
  category: "software"
  subtitle: "Triton Attention Kernel"
  year: 2026
  start: "Aug. 2026"
  end: "Present"
  sort_key: "9999-99-2026-08"
  summary: "A streaming Triton kernel for exact DeBERTa-v2/v3 attention that avoids materializing the full attention matrix. Benchmarks show up to 5.18× faster forward and 2.15× faster forward+backward than Hugging Face Transformers eager. Integrated into <a href=\"https://github.com/fastino-ai/GLiNER2\">GLiNER2</a> (fastino-ai) as an optional attention backend, released in v2.1.0. The arXiv paper <em>Fast and Exact Relative-Position Attention via Structure-Aware Kernels</em> (under review) is a continuation of this project."
  primary_url: "https://github.com/delyan-boychev/disentangled-flash"
  links:
