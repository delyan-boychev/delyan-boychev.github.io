- id: "synthetic-image-detection"
  title: "Synthetic Image Detection via Supervised Contrastive Learning"
  category: "past-research"
  subtitle: "ML Research"
  start: "Aug 2023"
  end: "Aug 2024"
  sort_key: "2024-08-2023-08"
  link: "https://arxiv.org/abs/2407.20020"
  link_label: "Research paper"
  summary: "The research project behind ImagiNet, a diverse synthetic-image benchmark and generalizable contrastive-learning baseline."
  links:
    - label: "Paper"
      url: "https://arxiv.org/abs/2407.20020"
  bullets:
    - "Generative models, such as Diffusion Models, Variational Auto-Encoders, and Generative Adversarial Networks, produce images with a level of authenticity that makes them nearly indistinguishable from real photos and artwork."
    - "The work provides a new balanced training and benchmarking dataset containing diverse image content — photos, paintings, faces, and uncategorised images."
    - "Unlike previous datasets, it includes images from multiple generators — open-source and proprietary — during training."
    - "To establish a baseline, we train a ResNet-50 model using a self-supervised contrastive (SelfCon) objective for synthetic image detection and model identification."
    - "The model demonstrates strong performance across previously available benchmarks, achieving an AUC of up to 0.97 and balanced accuracy ranging between 80% and 93%, even under social network conditions involving compression and resizing."
    - "Shared research with Radostin Cholakov, accepted for presentation at the Workshop on Datasets and Evaluators of AI Safety, AAAI 2025."

- id: "interpretability-research"
  title: "Increasing Computer Vision Models Interpretability"
  category: "past-research"
  subtitle: "ML Research"
  start: "Aug 2022"
  end: "June 2023"
  sort_key: "2023-06-2022-08"
  link: "https://arxiv.org/abs/2307.02500"
  link_label: "Research paper"
  summary: "An investigation into the relationship between adversarial robustness, explainability, and meaningful visual representations."
  links:
    - label: "Paper"
      url: "https://arxiv.org/abs/2307.02500"
  bullets:
    - "The work aims to evaluate the effects of adversarial training (conducted via the Projected Gradient Descent algorithm) utilized to produce robust models — less vulnerable to adversarial attacks."
